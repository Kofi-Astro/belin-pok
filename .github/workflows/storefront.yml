name: Storefront

# Cloudflare Pages deploys apps/storefront itself via its native GitHub
# integration -- see the README for the exact dashboard build settings, a
# separate Pages project from apps/admin's. This workflow only
# lints/analyzes on PRs so bad code doesn't land on main; it doesn't
# deploy anything, to avoid a second, conflicting deploy path.

on:
  pull_request:
    paths:
      - "apps/storefront/**"
      - "packages/belpok_core/**"
      - ".github/workflows/storefront.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
