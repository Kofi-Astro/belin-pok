name: Storefront

# apps/storefront is the Flutter phone app. It isn't deployed from here:
# release builds are made and published to the app stores by hand (see
# the README's "Production release builds"). This workflow only
# lints/analyzes on PRs so bad code doesn't land on main.

on:
  pull_request:
    paths:
      - "apps/storefront/**"
      - "packages/belpok_core/**"
      - ".github/workflows/storefront.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
