name: API

# Railway deploys services/api itself via its native GitHub integration
# (already linked) -- see the README for the required Railway dashboard
# setting. This workflow only lints/tests, so bad code doesn't land on
# main; it doesn't deploy anything, to avoid a second, conflicting deploy
# path.

on:
  pull_request:
    paths:
      - "services/api/**"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # A plain Postgres container, not the full Supabase CLI stack -- much
    # faster in CI. tests/ci_bootstrap.sql stands in for the auth/storage
    # schemas a real Supabase project provides natively, just enough for
    # supabase/migrations/ to apply unmodified. See that file for why this
    # is safe (tests run as the Postgres superuser, which bypasses RLS
    # regardless, so the stub auth.uid() never needs to return anything
    # meaningful).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Apply schema (CI bootstrap + real migrations + seed)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/ci_bootstrap.sql
          for f in ../../supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f ../../supabase/seed.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SUPABASE_URL: https://rkjcrvgtbrbdzjakgtpz.supabase.co
        run: pytest -v
