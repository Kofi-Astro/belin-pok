name: API

# Railway deploys services/api itself via its native GitHub integration
# (already linked) -- see the README for the required Railway dashboard
# setting. This workflow only lints/tests, so bad code doesn't land on
# main; it doesn't deploy anything, to avoid a second, conflicting deploy
# path.

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # A plain Postgres container -- the same kind of database production
    # runs on (Railway Postgres), with the schema built by the same
    # migration runner Railway's pre-deploy step uses.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-only-not-a-real-secret
        run: python -m app.migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-only-not-a-real-secret
        run: python -m pytest -v
