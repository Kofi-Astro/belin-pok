[tool.pytest.ini_options]
asyncio_mode = "auto"
# The app's async SQLAlchemy engine (app/db.py) is a module-level singleton,
# same as it is in the running app -- so all tests need to share one event
# loop, or asyncpg connections end up bound to a loop that a later test's
# default per-function loop has already closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
